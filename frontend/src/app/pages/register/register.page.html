<ion-header><ion-toolbar><ion-title>Register</ion-title></ion-toolbar></ion-header>
<ion-content class="ion-padding">
  <ion-input [(ngModel)]="email" placeholder="Email"></ion-input>
  <ion-input [(ngModel)]="password" placeholder="Password" type="password"></ion-input>
  <ion-button expand="block" (click)="register()">Register</ion-button>
  <ion-button fill="clear" routerLink="/login">Already have an account?</ion-button>
</ion-content>
