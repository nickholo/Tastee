<ion-header >
  <ion-toolbar>
    <ion-title>
      Tab 1
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content >
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Home</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content fullscreen class="recipe-content">
    @for (card of content; track card.cardId) {
      <app-recipe-card (swiped)="updateFeed($event)" [cardId]="card.cardId" [imgUrl]="card.imgurl"></app-recipe-card>
  
}
</ion-content>
</ion-content>
