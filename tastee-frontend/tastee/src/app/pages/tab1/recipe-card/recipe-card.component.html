<div class="card" [class.animation]="animation" (animationend)="onAnimationEnd()">
  <ion-card button class="recipe-card" (click)="handleCardClick()" >
    <img alt="Silhouette of mountains" [src]="card.imgUrl" draggable="false" />
    <ion-card-header>
      <ion-card-title>{{card.title}}</ion-card-title>
      <ion-card-subtitle>{{card.cardId}}</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      {{card.description}}
    </ion-card-content>
  </ion-card>
</div>
