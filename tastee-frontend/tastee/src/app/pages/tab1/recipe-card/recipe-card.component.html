<ion-card
  class="recipe-card"
  [class.swipe-left]="animation === 'dislike'"
  [class.swipe-right]="animation === 'like'"
  (animationend)="onAnimationEnd()">
  <img alt="Silhouette of mountains" [src]="card.imgUrl" draggable="false" />
  <ion-card-header>
    <ion-card-title>{{card.title}}</ion-card-title>
    <ion-card-subtitle>{{card.author?.username}}</ion-card-subtitle>
  </ion-card-header>

  <ion-card-content>
    {{card.description}}
  </ion-card-content>
  <div class="card-actions">
    <ion-button fill="outline" color="primary" (click)="likeCard()">
      <ion-icon name="heart-outline"></ion-icon>
    </ion-button>
    <ion-button fill="outline" color="secondary" (click)="dislikeCard()">
      <ion-icon name="heart-dislike-outline"></ion-icon>
    </ion-button>
  </div>
</ion-card>
